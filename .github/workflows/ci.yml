name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv sync --dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-report=term-missing

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, dashboard]
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag sentinelsme:test .
      - name: Execute controlled Compose scan and worker smoke test
        env:
          AI_SOC_API_KEY: ci-controlled-synthetic-key
        run: |
          printf 'AI_SOC_API_KEY=ci-controlled-synthetic-key\nPOSTGRES_PASSWORD=ci-controlled-synthetic-password\nAI_SOC_AUTH_MODE=local\n' > .env
          docker compose up --build --wait --wait-timeout 180
          docker compose exec -T api python -m app.demo --tenant container-acceptance
          docker compose exec -T api python -m app.worker --once --enable-demo --tenant container-acceptance
          python -m pip install httpx
          python scripts/verify_container.py
      - if: always()
        run: docker compose down --volumes

