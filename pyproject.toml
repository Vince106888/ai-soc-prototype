[project]
name = "ai-soc-prototype"
version = "1.0.0"
description = "Evidence-backed cybersecurity monitoring prototype for small cloud-email environments"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.53,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

