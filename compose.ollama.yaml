# Ollama shares the API network namespace. The adapter still uses loopback;
# port 11434 is never published, and no remote model URL is permitted.
services:
  api:
    environment:
      AI_SOC_EXPLAINER: ollama
      AI_SOC_OLLAMA_URL: http://127.0.0.1:11434
      AI_SOC_OLLAMA_MODEL: ${AI_SOC_OLLAMA_MODEL:-qwen2.5:3b}
  worker:
    network_mode: service:api
    environment:
      AI_SOC_EXPLAINER: ollama
      AI_SOC_OLLAMA_URL: http://127.0.0.1:11434
      AI_SOC_OLLAMA_MODEL: ${AI_SOC_OLLAMA_MODEL:-qwen2.5:3b}
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    network_mode: service:api
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/models
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 24
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    pids_limit: 256
    mem_limit: ${AI_SOC_MODEL_MEMORY:-4g}
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ollama-models:
