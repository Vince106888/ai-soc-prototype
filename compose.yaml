x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    env_file: ${AI_SOC_ENV_FILE:-.env}
    environment:
      AI_SOC_API_KEY: ${AI_SOC_API_KEY:?set AI_SOC_API_KEY in .env}
      AI_SOC_ALLOWED_HOSTS: localhost,127.0.0.1,api
      AI_SOC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelsme}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sentinelsme}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AI_SOC_PORT:-8000}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *bounded-logging
    pids_limit: 256
    mem_limit: ${AI_SOC_API_MEMORY:-768m}
    stop_grace_period: 30s

  worker:
    build: .
    env_file: ${AI_SOC_ENV_FILE:-.env}
    command: ["python", "-m", "app.worker"]
    environment:
      AI_SOC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelsme}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sentinelsme}
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *bounded-logging
    pids_limit: 128
    mem_limit: ${AI_SOC_WORKER_MEMORY:-512m}
    stop_grace_period: 150s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelsme}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelsme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - sentinelsme-data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *bounded-logging
    pids_limit: 256
    mem_limit: ${AI_SOC_DB_MEMORY:-1g}
    stop_grace_period: 60s

volumes:
  sentinelsme-data:
